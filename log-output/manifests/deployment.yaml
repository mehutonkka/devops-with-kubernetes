apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      volumes:
        - name: shared-log
          emptyDir: {}
      containers:
        - name: log-writer
          image: log-output-writer:1.1
          imagePullPolicy: Never
          volumeMounts:
            - name: shared-log
              mountPath: /usr/src/app/files
        - name: log-reader
          image: log-output-reader:1.0
          imagePullPolicy: Never
          env:
            - name: PORT
              value: "3000"
          volumeMounts:
            - name: shared-log
              mountPath: /usr/src/app/files
